# Spring Boot Microservice Configuration with SQLite & JavaMailSender
server.port=8085

# SQLite Database Connection
spring.datasource.url=jdbc:sqlite:vernacular_pedagogy.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate for SQLite
spring.jpa.database-platform=org.hibernate.community.dialects.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JavaMailSender Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=alonewarrior123456@gmail.com
spring.mail.password=wpcemazdsvlfjpoc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Logging
logging.level.com.sih.vernacular=DEBUG
